
<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style type="text/css">
    @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap");

    * {
      margin: 0;
      padding: 0;
      border: 0;
      box-sizing: border-box;
      outline: none;
      font-family: "Roboto", sans-serif;
    }

    *::-webkit-scrollbar {
      width: 6px;
      outline: none;
      border: none;
      background: transparent;
      padding: 3px;
    }

    *::-webkit-scrollbar-thumb {
      background: rgb(67, 69, 79);
      border-radius: 6px;
    }

    *::-webkit-scrollbar-track {
      background: rgb(14, 15, 17);
    }

    body {
      background: rgb(29, 30, 34);
      color: rgb(229, 232, 235);
    }

    #main {
      width: 100%;
      min-height: 100vh;
      transition: opacity 0.3s ease;
    }

    .container {
      display: flex;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      text-decoration: underline;
      color: #6d9dd9;
    }
  </style>
</head>

<body>
  <div id="main">
    <div class="container">
      <h1 style="text-align: center;">A videó megtekintéséhez kattints a megnyitás új lapon gombra.</h1>
      <h2 style="text-align: center;"><ins>A fordító oldalán lehet megtekinteni az animét.</ins></h2>
    </div>
  </div>
</body>

</html>
