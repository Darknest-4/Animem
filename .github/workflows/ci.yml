name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  # Fast feedback: style, static analysis and dependency audit run without a
  # database, so a typo fails in under a minute instead of after the test matrix.
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, mbstring, intl, sodium
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=512M

      - name: Dependency audit
        run: composer audit --abandoned=report

      - name: Fail if a secret was committed
        run: |
          # The legacy site shipped its production database password in four
          # tracked JSON files. This is the cheapest possible guard against a repeat.
          if git grep -nIE '(DB_PASSWORD|APP_SECRET)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9+/]{16,}' \
               -- ':!*.example' ':!.github/**' ':!docs/**' ':!html/**' ':!Config/**' ':!private/**'; then
            echo "::error::A credential-looking literal is committed outside .env.example"
            exit 1
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yume_test
          POSTGRES_USER: yume
          POSTGRES_PASSWORD: yume
        options: >-
          --health-cmd "pg_isready -U yume -d yume_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, mbstring, intl, sodium
          coverage: xdebug
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # Unit, contract and security suites need no database and cover the
      # architectural invariants, so they run first and fail fastest.
      - name: Unit tests
        run: vendor/bin/phpunit -c apps/api/phpunit.xml --testsuite=unit

      - name: Architecture contracts
        run: vendor/bin/phpunit -c apps/api/phpunit.xml --testsuite=contract

      - name: Security regressions
        run: vendor/bin/phpunit -c apps/api/phpunit.xml --testsuite=security

      - name: Integration and feature tests
        env:
          TEST_DB_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=yume_test'
          TEST_DB_USERNAME: yume
          TEST_DB_PASSWORD: yume
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: yume_test
          DB_USERNAME: yume
          DB_PASSWORD: yume
          APP_SECRET: ci-secret-that-is-at-least-32-bytes-long
        run: vendor/bin/phpunit -c apps/api/phpunit.xml --testsuite=integration,feature

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/php/Dockerfile
          target: production
          tags: yume-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image runs as a non-root user
        run: |
          USER_ID=$(docker run --rm --entrypoint id yume-api:ci -u)
          if [ "$USER_ID" = "0" ]; then
            echo "::error::The production image runs as root"
            exit 1
          fi

      - name: Verify no dev dependencies leaked into the image
        run: |
          if docker run --rm --entrypoint sh yume-api:ci -c 'ls vendor/bin 2>/dev/null | grep -q phpunit'; then
            echo "::error::PHPUnit is present in the production image"
            exit 1
          fi

      - name: Boot the stack and smoke test it
        run: |
          cp .env.example .env
          sed -i "s|^APP_SECRET=.*|APP_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T app php /var/www/html/apps/api/bin/console migrate
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/health/ready | grep -q '"status":"ready"'
          # Deny-by-default must hold in a real container, not just in a unit test.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/admin/users)" = "401"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
