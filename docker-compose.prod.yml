# Production overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds Caddy for TLS, applies resource limits and hardening, and publishes
# nothing except 80/443.

services:
  app:
    build:
      target: production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIES: "true"
      LOG_LEVEL: info
    # The image is immutable; only storage/ needs to be writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 768M}
        reservations: {cpus: "0.5", memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  worker:
    build:
      dockerfile: infrastructure/docker/worker/Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: info
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  nginx:
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Binding port 80 inside the container needs this one capability back.
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 128M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres:
    # No published port: reachable only over the internal network.
    ports: []
    security_opt:
      - no-new-privileges:true
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=500
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
        reservations: {cpus: "0.5", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set for TLS}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set for TLS}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    networks: [frontend]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy_data:
  caddy_config:
