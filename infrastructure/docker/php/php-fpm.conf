[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 32
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; Recycle workers to bound the damage from a slow leak in any one request.
pm.max_requests = 500

; Logs go to the container's stderr so the platform collects them.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Kill a worker stuck past the API's own timeout budget.
request_terminate_timeout = 60s
; Log a backtrace for anything slower than this, to catch pathological queries.
request_slowlog_timeout = 5s
slowlog = /dev/stderr

clear_env = no
