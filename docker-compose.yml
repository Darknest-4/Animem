# Base composition, shared by development and production.
#
# `docker compose up` alone gives a working development stack because
# docker-compose.override.yml is applied automatically. Production uses
# `-f docker-compose.yml -f docker-compose.prod.yml`, which never loads the override.

name: yume

services:
  app:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: production
    image: yume-api:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    # storage/ is the only path the application writes to.
    volumes:
      - app_storage:/var/www/html/apps/api/storage

  # Runs migrations once, then exits. `app` and `worker` are not gated on it:
  # a failed migration should surface as a failed job, not as a stack that never
  # starts, and the API answers /health while /health/ready reports degraded.
  migrate:
    image: yume-api:latest
    restart: "no"
    env_file: [.env]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "/var/www/html/apps/api/bin/console", "migrate"]
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
      args:
        YUME_IMAGE: yume-api:latest
    image: yume-worker:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [backend]
    volumes:
      - app_storage:/var/www/html/apps/api/storage
    # SIGTERM lets the worker finish the job in flight.
    stop_signal: SIGTERM
    stop_grace_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yume}
      POSTGRES_USER: ${DB_USERNAME:-yume}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Without this, initdb picks C collation and every ORDER BY on Hungarian
      # titles sorts wrongly.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-yume} -d ${DB_DATABASE:-yume}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [backend]

networks:
  frontend:
  # The database, the API and the worker are unreachable from outside the host.
  # Only nginx bridges the two networks, and only Caddy publishes a port.
  backend:
    internal: true

volumes:
  postgres_data:
  app_storage:
