; Development overrides. Loaded after php.ini, never present in the production image.

; Still Off: errors belong in the JSON log and in the API's problem+json body,
; not interleaved into a response. APP_DEBUG adds detail to that body instead.
display_errors = Off
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = disable

xdebug.mode = develop,debug,coverage
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = yume

memory_limit = 512M
max_execution_time = 0
