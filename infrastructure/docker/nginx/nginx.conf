worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access log so it lands in the same pipeline as the application's logs.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_duration":"$upstream_response_time",'
        '"request_id":"$http_x_request_id",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout  30s;
    client_max_body_size 12m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain text/css application/javascript image/svg+xml;

    # Coarse edge limit. The application applies the real per-identity budgets;
    # this only stops a flood from reaching PHP-FPM at all.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    upstream php-fpm {
        server app:9000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root /var/www/html/apps/api/public;
        index index.php;

        # Every response comes from the single front controller. There is no
        # path under this root that maps to a source file.
        location / {
            limit_req zone=api burst=60 nodelay;
            try_files $uri /index.php$is_args$args;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param HTTPS           $http_x_forwarded_proto;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_keep_conn on;
        }

        # Defence in depth: even if a .php file ever appeared under the web root,
        # only index.php above is executable.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
            access_log off;
        }

        # Health probes should not be throttled or logged.
        location = /health {
            access_log off;
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param DOCUMENT_ROOT   $document_root;
        }
    }
}
