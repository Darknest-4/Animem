# Development overrides, applied automatically by `docker compose up`.
#
# Publishes the ports a developer needs, bind-mounts the source for instant
# feedback, and adds Adminer and Mailpit. None of this reaches production, which
# runs with `-f docker-compose.yml -f docker-compose.prod.yml`.

services:
  app:
    build:
      target: development
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      SESSION_SECURE_COOKIES: "false"
      LOG_LEVEL: debug
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/apps/api/storage

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: development
    entrypoint: ["php", "/var/www/html/apps/api/bin/worker"]
    environment:
      APP_ENV: local
      LOG_LEVEL: debug
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/apps/api/storage

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: development
    volumes:
      - .:/var/www/html

  nginx:
    ports:
      - "${APP_PORT:-8080}:80"

  postgres:
    ports:
      # Exposed so a local client can connect; the port is not published in production.
      - "${DB_PORT_PUBLISHED:-55432}:5432"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [frontend, backend]
