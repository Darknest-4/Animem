; Production PHP settings.
;
; display_errors is off with no environment switch that can turn it on: the
; legacy site enabled it in six separate files and printed failing SQL to the
; browser. Errors are rendered by ErrorHandlerMiddleware and logged as JSON.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

memory_limit = 256M
max_execution_time = 30
post_max_size = 12M
upload_max_filesize = 10M
max_input_vars = 200

date.timezone = UTC
default_charset = UTF-8

; Sessions are stored in PostgreSQL by the application, not by PHP's handler.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image is immutable, so the timestamp check is pure overhead.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

apc.enable_cli = 0
